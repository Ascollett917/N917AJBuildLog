<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#159957">
    <meta name="description" content="Follow the construction of N917AJ, one build-log entry at a time.">
    <title>N917AJ | Aircraft Build Log</title>
    <style>
      :root {
        color-scheme: light;
        --green: #159957;
        --blue: #155799;
        --ink: #263238;
        --muted: #64748b;
        --line: #e5eaf0;
        --paper: #fff;
        --canvas: #f5f7f9;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      a { color: var(--blue); }

      .hero {
        padding: 40px 24px 36px;
        background:
          linear-gradient(90deg, rgb(8 20 34 / 78%), rgb(8 20 34 / 28%)),
          url("./img_0204-banner.jpg") center 54% / cover no-repeat;
        color: #fff;
      }

      .hero-inner, main, footer {
        width: min(100% - 40px, 1080px);
        margin-inline: auto;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #d7f3e5;
        font-size: .75rem;
        font-weight: 750;
        letter-spacing: .16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 7vw, 4.5rem);
        letter-spacing: -.055em;
        line-height: 1.05;
      }

      .intro {
        max-width: 640px;
        margin: 17px 0 0;
        color: #eefaf4;
        font-size: clamp(1rem, 2.5vw, 1.2rem);
      }

      .contributors {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 9px;
        margin-top: 17px;
      }

      .contributors-label { color: #e0f5e9; font-size: .82rem; font-weight: 650; }
      .contributor {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 4px 10px 4px 5px;
        border: 1px solid rgb(255 255 255 / 27%);
        border-radius: 999px;
        background: rgb(255 255 255 / 10%);
        color: #fff;
        font-size: .82rem;
      }

      .contributor img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
      .contributor-avatar {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border-radius: 50%;
        background: #e8f5ee;
        color: #16794a;
        font-size: .68rem;
        font-weight: 750;
      }

      .contributor-role { color: #d7f3e5; font-size: .72rem; }

      .documents-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 20px;
        padding: 8px 13px;
        border: 1px solid rgb(255 255 255 / 55%);
        border-radius: 999px;
        color: #fff;
        font-size: .9rem;
        font-weight: 650;
        text-decoration: none;
        transition: background .15s;
      }

      .documents-link:hover, .documents-link:focus-visible { background: rgb(255 255 255 / 17%); }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }

      .stat {
        min-width: 132px;
        padding: 10px 15px;
        border: 1px solid rgb(255 255 255 / 27%);
        border-radius: 10px;
        background: rgb(255 255 255 / 10%);
      }

      .stat strong, .stat span { display: block; }
      .stat strong { font-size: 1.2rem; }
      .stat span { color: #e0f5e9; font-size: .8rem; }

      main { padding-block: 34px 64px; }

      .toolbar {
        display: grid;
        gap: 18px;
        margin-bottom: 28px;
      }

      .search-wrap { position: relative; }

      .search-wrap::before {
        position: absolute;
        top: 50%;
        left: 16px;
        color: var(--muted);
        content: "⌕";
        font-size: 1.5rem;
        line-height: 1;
        transform: translateY(-55%);
      }

      .category-sections {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: start;
        gap: 30px 18px;
      }

      .category-section { min-width: 0; }
      .category-heading { margin: 0 0 11px; }
      .category-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #16794a;
        font-size: 1.05rem;
        font-weight: 750;
        text-decoration: none;
      }

      .category-link:hover { color: var(--blue); text-decoration: underline; }
      .category-link:focus-visible, .photo-button:focus-visible,
      dialog button:focus-visible, .category-all-link:focus-visible {
        outline: 3px solid #70cba1;
        outline-offset: 2px;
      }

      .entry {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--paper);
        box-shadow: 0 3px 12px rgb(23 43 77 / 4%);
      }

      .entry-photo {
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: #e9eef2;
      }

      .entry-photo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform .25s;
      }

      .entry:hover .entry-photo img { transform: scale(1.025); }

      .photo-button {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        border: 0;
        background: transparent;
        cursor: zoom-in;
      }

      .photo-count {
        position: absolute;
        right: 10px;
        bottom: 10px;
        z-index: 1;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgb(20 30 40 / 78%);
        color: #fff;
        font-size: .75rem;
        pointer-events: none;
      }

      .entry-body { padding: 17px 18px 18px; }
      .entry-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 10px; }

      .category-label {
        padding: 3px 9px;
        border-radius: 999px;
        background: #e8f5ee;
        color: #16794a;
        font-size: .74rem;
        font-weight: 700;
      }

      .entry time, .reference { color: var(--muted); font-size: .8rem; }
      .entry h3 { margin: 10px 0 5px; font-size: 1.12rem; line-height: 1.35; }
      .entry-title {
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        text-align: left;
      }

      .entry-title:hover { color: var(--blue); text-decoration: underline; }
      .entry-title:focus-visible { outline: 3px solid #70cba1; outline-offset: 3px; }
      .entry p { margin: 0; color: #526170; font-size: .92rem; }
      .entry-details { display: flex; flex-wrap: wrap; gap: 7px 13px; margin-top: 12px; }
      .reference { font-weight: 600; }

      .category-all-link {
        display: inline-block;
        margin-top: 10px;
        font-size: .9rem;
        font-weight: 650;
        text-decoration: none;
      }

      .category-all-link:hover { text-decoration: underline; }
      .category-empty { margin: 0; color: var(--muted); }
      .category-time { margin: 8px 0 0; color: var(--muted); font-size: .82rem; }
      .entry-gallery { border-top: 1px solid var(--line); }
      .photo-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 9px; padding: 0 14px 14px; }

      .video-section { padding: 0 14px 16px; }
      .video-section h4 { margin: 0 0 10px; font-size: .95rem; }
      .video-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; }
      .video-gallery video { display: block; width: 100%; max-height: 420px; border-radius: 8px; background: #101820; }
      .video-caption { margin: 6px 0 0 !important; color: var(--muted) !important; font-size: .82rem !important; }

      .gallery-photo {
        padding: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        color: var(--muted);
        cursor: zoom-in;
        text-align: left;
      }

      .gallery-photo img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
      .gallery-photo span { display: block; padding: 5px 7px; font-size: .75rem; }

      .loading, .error {
        padding: 40px 20px;
        border: 1px dashed #cbd5df;
        border-radius: 12px;
        background: var(--paper);
        color: var(--muted);
        text-align: center;
      }

      .error { color: #a33a32; }
      [hidden] { display: none !important; }

      footer {
        padding-block: 20px 34px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: .85rem;
      }

      dialog {
        width: min(94vw, 1100px);
        max-width: none;
        max-height: 92vh;
        padding: 0;
        overflow: hidden;
        border: 0;
        border-radius: 12px;
        background: #101820;
        color: #fff;
        box-shadow: 0 18px 70px rgb(0 0 0 / 40%);
      }

      dialog::backdrop { background: rgb(9 20 30 / 82%); }
      dialog img { display: block; width: 100%; max-height: 82vh; object-fit: contain; }
      .dialog-bar { display: flex; justify-content: space-between; gap: 15px; padding: 10px 14px; }
      .dialog-bar p { margin: 0; align-self: center; }
      .dialog-bar button { border: 0; background: transparent; color: #fff; cursor: pointer; font: inherit; }

      @media (min-width: 760px) {
        .hero { padding-block: 54px 45px; }
        .toolbar { grid-template-columns: 1fr; }
      }

      @media (max-width: 820px) {
        .category-sections { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (max-width: 560px) {
        .category-sections { grid-template-columns: minmax(0, 1fr); gap: 24px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="hero-inner">
        <p class="eyebrow">Experimental aircraft · N917AJ</p>
        <h1>The build log</h1>
        <p class="intro">A record of the people, projects, and small victories behind building an airplane.</p>
        <div id="contributors" class="contributors" aria-label="Build contributors"></div>
        <a class="documents-link" href="./documents.html">Build documents <span aria-hidden="true">→</span></a>
        <div class="stats" aria-label="Build log statistics">
          <div class="stat"><strong id="total-entries">—</strong><span>build entries</span></div>
          <div class="stat"><strong id="total-time">—</strong><span>total build hours</span></div>
          <div class="stat"><strong id="latest-date">—</strong><span>most recent entry</span></div>
        </div>
      </div>
    </header>

    <main>
      <section aria-label="Build log categories">
        <div id="status" class="loading" role="status">Loading the build log…</div>
        <div id="categories" class="category-sections"></div>
      </section>
    </main>

    <footer>Built one step at a time. This log is for sharing the journey of N917AJ.</footer>

    <dialog id="photo-dialog" aria-label="Build log photo">
      <div class="dialog-bar">
        <p id="photo-caption"></p>
        <button id="close-photo" type="button" aria-label="Close photo">Close ×</button>
      </div>
      <img id="large-photo" alt="">
    </dialog>

    <script>
      const categoriesContainer = document.querySelector("#categories");
      const contributorsContainer = document.querySelector("#contributors");
      const status = document.querySelector("#status");
      const photoDialog = document.querySelector("#photo-dialog");
      const largePhoto = document.querySelector("#large-photo");
      const photoCaption = document.querySelector("#photo-caption");
      let allEntries = [];

      const clean = (value) => typeof value === "string" ? value.trim() : "";
      const assetUrl = (filename) => "./logs/" + filename.split("/").map(encodeURIComponent).join("/");
      const categoryUrl = (name) => `./category.html?name=${encodeURIComponent(name)}`;
      const formatDate = (value) => {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? "Date unavailable" : new Intl.DateTimeFormat(undefined, {
          year: "numeric", month: "short", day: "numeric", timeZone: "UTC"
        }).format(date);
      };
      const formatDuration = (seconds) => {
        const hours = Number(seconds) / 3600;
        return Number.isFinite(hours) && hours > 0 ? `${Number.isInteger(hours) ? hours : hours.toFixed(1)} hr${hours === 1 ? "" : "s"}` : "";
      };
      const formatHours = (seconds) => {
        const hours = Number(seconds) / 3600;
        return new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 }).format(hours);
      };

      function renderContributors(contributors) {
        contributorsContainer.replaceChildren();
        const label = document.createElement("span");
        label.className = "contributors-label";
        label.textContent = "Built by";
        contributorsContainer.append(label);
        const ordered = contributors.slice().sort((a, b) => (a.sortOrder ?? 0) - (b.sortOrder ?? 0));
        for (const person of ordered) {
          const name = [person.givenName, person.middleName, person.familyName]
            .map(clean).filter(Boolean).join(" ") || clean(person.organizationName);
          if (!name) continue;

          const chip = document.createElement("span");
          chip.className = "contributor";
          if (clean(person.filename)) {
            const image = document.createElement("img");
            image.src = assetUrl(person.filename);
            image.alt = "";
            image.loading = "lazy";
            image.addEventListener("error", () => {
              const avatar = document.createElement("span");
              avatar.className = "contributor-avatar";
              avatar.setAttribute("aria-hidden", "true");
              avatar.textContent = name.split(/\s+/).slice(0, 2).map((part) => part[0]).join("").toUpperCase();
              image.replaceWith(avatar);
            }, { once: true });
            chip.append(image);
          }
          const personName = document.createElement("span");
          personName.textContent = name;
          chip.append(personName);
          if (person.isMainBuilder) {
            const role = document.createElement("span");
            role.className = "contributor-role";
            role.textContent = "Builder";
            chip.append(role);
          }
          contributorsContainer.append(chip);
        }
      }

      function createEntry(entry, index, showCategory = true) {
        const article = document.createElement("article");
        article.className = "entry";
        const assets = Array.isArray(entry.assets) ? entry.assets : [];
        const photos = assets.filter((asset) => asset && clean(asset.filename));
        const videos = (Array.isArray(entry.videos) ? entry.videos : [])
          .map((video) => typeof video === "string" ? { filename: video } : video)
          .filter((video) => video && clean(video.filename));
        const hasMedia = photos.length > 0 || videos.length > 0;
        const firstPhoto = photos[0];
        const gallery = document.createElement("div");
        gallery.className = "entry-gallery";
        gallery.id = `entry-gallery-${index}`;
        gallery.hidden = true;

        if (firstPhoto) {
          const imageFrame = document.createElement("div");
          imageFrame.className = "entry-photo";
          const image = document.createElement("img");
          image.src = assetUrl(firstPhoto.filename);
          image.alt = clean(firstPhoto.description) || `${clean(entry.title) || "Build log"} photo`;
          image.loading = "lazy";
          image.decoding = "async";
          imageFrame.append(image);

          const button = document.createElement("button");
          button.className = "photo-button";
          button.type = "button";
          button.setAttribute("aria-label", `Open ${clean(entry.title) || "build log entry"} and view all photos and videos`);
          button.addEventListener("click", () => {
            gallery.hidden = false;
            titleButton.setAttribute("aria-expanded", "true");
            gallery.scrollIntoView({ behavior: "smooth", block: "nearest" });
          });
          imageFrame.append(button);

          if (assets.length > 1) {
            const photoCount = document.createElement("span");
            photoCount.className = "photo-count";
            photoCount.textContent = `${assets.length} photos`;
            imageFrame.append(photoCount);
          }
          article.append(imageFrame);
        }

        const body = document.createElement("div");
        body.className = "entry-body";
        const meta = document.createElement("div");
        meta.className = "entry-meta";
        if (showCategory) {
          const category = document.createElement("span");
          category.className = "category-label";
          category.textContent = clean(entry.category) || "Uncategorized";
          meta.append(category);
        }
        const date = document.createElement("time");
        date.dateTime = clean(entry.created);
        date.textContent = formatDate(entry.created);
        meta.append(date);
        body.append(meta);

        const title = document.createElement("h3");
        const titleText = clean(entry.title) || "Build log entry";
        let titleButton;
        if (hasMedia) {
          titleButton = document.createElement("button");
          titleButton.className = "entry-title";
          titleButton.type = "button";
          titleButton.textContent = titleText;
          titleButton.setAttribute("aria-expanded", "false");
          titleButton.setAttribute("aria-controls", gallery.id);
          titleButton.addEventListener("click", () => {
            gallery.hidden = !gallery.hidden;
            titleButton.setAttribute("aria-expanded", String(!gallery.hidden));
          });
          title.append(titleButton);
        } else {
          title.textContent = titleText;
        }
        body.append(title);
        const summary = clean(entry.summary);
        if (summary) {
          const description = document.createElement("p");
          description.textContent = summary;
          body.append(description);
        }

        const details = document.createElement("div");
        details.className = "entry-details";
        const reference = clean(entry.reference);
        if (reference) {
          const ref = document.createElement("span");
          ref.className = "reference";
          ref.textContent = reference;
          details.append(ref);
        }
        const duration = formatDuration(entry.timeSpent);
        if (duration) {
          const time = document.createElement("span");
          time.className = "reference";
          time.textContent = duration;
          details.append(time);
        }
        if (details.childElementCount) body.append(details);
        article.append(body);

        if (photos.length) {
          const photoGrid = document.createElement("div");
          photoGrid.className = "photo-gallery";
          photos.forEach((photo, index) => {
            const photoButton = document.createElement("button");
            photoButton.className = "gallery-photo";
            photoButton.type = "button";
            const photoDescription = clean(photo.description) || `${clean(entry.title) || "Build log"} photo ${index + 1}`;
            photoButton.setAttribute("aria-label", `View ${photoDescription}`);
            const thumbnail = document.createElement("img");
            thumbnail.src = assetUrl(photo.filename);
            thumbnail.alt = photoDescription;
            thumbnail.loading = "lazy";
            thumbnail.decoding = "async";
            photoButton.append(thumbnail);
            const caption = document.createElement("span");
            caption.textContent = photoDescription;
            photoButton.append(caption);
            photoButton.addEventListener("click", () => {
              largePhoto.src = assetUrl(photo.filename);
              largePhoto.alt = photoDescription;
              photoCaption.textContent = `${clean(entry.title)} · Photo ${index + 1} of ${photos.length}`;
              photoDialog.showModal();
            });
            photoGrid.append(photoButton);
          });
          gallery.append(photoGrid);
        }
        if (videos.length) {
          const videoSection = document.createElement("section");
          videoSection.className = "video-section";
          const videoHeading = document.createElement("h4");
          videoHeading.textContent = "Videos";
          videoSection.append(videoHeading);
          const videoGrid = document.createElement("div");
          videoGrid.className = "video-gallery";
          videos.forEach((video, videoIndex) => {
            const videoItem = document.createElement("div");
            const player = document.createElement("video");
            player.controls = true;
            player.preload = "metadata";
            player.playsInline = true;
            player.src = assetUrl(video.filename);
            const description = clean(video.title) || clean(video.description) ||
              `${clean(entry.title) || "Build log"} video ${videoIndex + 1}`;
            player.setAttribute("aria-label", description);
            if (clean(video.poster)) player.poster = assetUrl(video.poster);
            videoItem.append(player);
            if (clean(video.description) || clean(video.title)) {
              const caption = document.createElement("p");
              caption.className = "video-caption";
              caption.textContent = clean(video.title) || clean(video.description);
              videoItem.append(caption);
            }
            videoGrid.append(videoItem);
          });
          videoSection.append(videoGrid);
          gallery.append(videoSection);
        }
        if (hasMedia) article.append(gallery);
        return article;
      }

      function renderCategoryPreviews(categories) {
        const orderedCategories = categories.slice().sort((a, b) => (a.sortOrder ?? 0) - (b.sortOrder ?? 0));
        categoriesContainer.replaceChildren(...orderedCategories.map((item, index) => {
          const name = clean(item.name);
          const categoryEntries = allEntries.filter((entry) =>
            clean(entry.category).toLocaleLowerCase() === name.toLocaleLowerCase()
          );
          const posts = categoryEntries.filter((entry) => clean(entry.title));
          const categorySeconds = categoryEntries.reduce((total, entry) => {
            const seconds = Number(entry.timeSpent);
            return total + (Number.isFinite(seconds) && seconds > 0 ? seconds : 0);
          }, 0);
          const section = document.createElement("section");
          section.className = "category-section";
          const heading = document.createElement("h2");
          heading.className = "category-heading";
          const link = document.createElement("a");
          link.className = "category-link";
          link.href = categoryUrl(name);
          link.textContent = name;
          heading.append(link);
          section.append(heading);

          if (posts.length) {
            section.append(createEntry(posts[0], `preview-${index}`, false));
          } else {
            const empty = document.createElement("p");
            empty.className = "category-empty";
            empty.textContent = "No build entries in this category yet.";
            section.append(empty);
          }

          const time = document.createElement("p");
          time.className = "category-time";
          time.textContent = `${formatHours(categorySeconds)} total build hours`;
          section.append(time);

          const allLink = document.createElement("a");
          allLink.className = "category-all-link";
          allLink.href = categoryUrl(name);
          allLink.textContent = `View all ${posts.length} ${posts.length === 1 ? "post" : "posts"} →`;
          section.append(allLink);
          return section;
        }));
      }

      async function loadBuildLog() {
        try {
          const [logsResponse, categoriesResponse, contributorsResponse] = await Promise.all([
            fetch("./logs/logs.json"),
            fetch("./logs/categories.json"),
            fetch("./logs/contributors.json")
          ]);
          if (!logsResponse.ok || !categoriesResponse.ok || !contributorsResponse.ok) {
            throw new Error("The build log or contributor data could not be loaded.");
          }
          const [logs, categories, contributors] = await Promise.all([
            logsResponse.json(), categoriesResponse.json(), contributorsResponse.json()
          ]);
          if (!Array.isArray(logs) || !Array.isArray(categories) || !Array.isArray(contributors)) {
            throw new Error("The build log or contributor data has an unexpected format.");
          }

          allEntries = logs.filter(Boolean)
            .slice().sort((a, b) => new Date(b.created) - new Date(a.created));

          const totalSeconds = allEntries.reduce((total, entry) => {
            const seconds = Number(entry.timeSpent);
            return total + (Number.isFinite(seconds) && seconds > 0 ? seconds : 0);
          }, 0);
          document.querySelector("#total-entries").textContent = allEntries.length.toLocaleString();
          document.querySelector("#total-time").textContent = formatHours(totalSeconds);
          document.querySelector("#latest-date").textContent = allEntries.length ? formatDate(allEntries[0].created) : "—";

          renderContributors(contributors);
          status.hidden = true;
          renderCategoryPreviews(categories.filter((category) => category && clean(category.name)));
        } catch (error) {
          status.className = "error";
          status.textContent = `${error.message} Open this page through a local web server rather than directly as a file.`;
        }
      }

      document.querySelector("#close-photo").addEventListener("click", () => photoDialog.close());
      photoDialog.addEventListener("click", (event) => {
        if (event.target === photoDialog) photoDialog.close();
      });
      loadBuildLog();
    </script>
  </body>
</html>
