<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1555e7">
    <meta name="description" content="Van's aircraft plans organized by section for the N917AJ build.">
    <title>Van's Plans | N917AJ</title>
    <style>
      :root {
        color-scheme: light;
        --blue: #155799;
        --ink: #263238;
        --muted: #64748b;
        --line: #e5eaf0;
        --paper: #fff;
        --canvas: #1b2630;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      a { color: var(--blue); }

      .hero {
        padding: 38px 24px 40px;
        background:
          linear-gradient(90deg, rgb(8 20 34 / 78%), rgb(8 20 34 / 28%)),
          url("./img_0204-banner.jpg") center 54% / cover no-repeat;
        color: #fff;
      }

      .hero-inner, main, footer {
        width: min(100% - 40px, 900px);
        margin-inline: auto;
      }

      .back-link { display: inline-block; margin-bottom: 20px; color: #e7f2ff; font-size: .92rem; text-decoration: none; }
      .back-link:hover { text-decoration: underline; }
      .eyebrow { margin: 0 0 8px; color: #d7f3e5; font-size: .75rem; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2.4rem, 7vw, 4.5rem); letter-spacing: -.055em; line-height: 1.05; }
      .intro { max-width: 640px; margin: 17px 0 0; color: #eefaf4; font-size: clamp(1rem, 2.5vw, 1.2rem); }

      main { min-height: 55vh; padding-block: 36px 64px; color: #f1f5f9; }
      .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
      h2 { margin: 0; font-size: 1.35rem; letter-spacing: -.025em; }
      #plan-count { color: #c5d0d9; font-size: .9rem; }
      .plans { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 13px; }

      .plan {
        display: flex;
        min-width: 0;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--paper);
        color: var(--ink);
        box-shadow: 0 3px 12px rgb(23 43 77 / 4%);
      }

      .plan-name { min-width: 0; }
      .plan h3 { margin: 0; overflow-wrap: anywhere; font-size: .98rem; line-height: 1.35; }
      .plan p { margin: 3px 0 0; color: var(--muted); font-size: .78rem; }
      .plan a { flex: 0 0 auto; padding: 6px 10px; border: 1px solid var(--blue); border-radius: 8px; background: var(--blue); color: #fff; font-size: .82rem; font-weight: 650; text-decoration: none; }
      .plan a:hover { filter: brightness(.94); }
      .plan a:focus-visible, .back-link:focus-visible { outline: 3px solid #70cba1; outline-offset: 3px; }
      .status { padding: 30px 20px; border: 1px dashed #cbd5df; border-radius: 12px; background: var(--paper); color: var(--muted); text-align: center; }
      .status.error { color: #a33a32; }
      [hidden] { display: none !important; }
      footer { padding-block: 20px 34px; border-top: 1px solid rgb(255 255 255 / 18%); color: #c5d0d9; font-size: .85rem; }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="hero-inner">
        <a class="back-link" href="./documents.html">← Back to documents</a>
        <p class="eyebrow">Experimental aircraft · N917AJ</p>
        <h1>Van's Plans</h1>
        <p class="intro">Aircraft plans organized by section. Open a plan in a new tab or download a copy.</p>
      </div>
    </header>

    <main>
      <section aria-labelledby="plans-heading">
        <div class="section-heading">
          <h2 id="plans-heading">Plans by section</h2>
          <span id="plan-count" aria-live="polite"></span>
        </div>
        <div id="status" class="status" role="status">Loading Van's plans…</div>
        <div id="plans" class="plans"></div>
      </section>
    </main>

    <footer>Van's aircraft plans for the N917AJ build.</footer>

    <script>
      const plansContainer = document.querySelector("#plans");
      const status = document.querySelector("#status");
      const planCount = document.querySelector("#plan-count");

      function planUrl(filename) {
        return "./logs/Documents/VansPlans/" + filename.split("/").map(encodeURIComponent).join("/");
      }

      function planTitle(filename) {
        const stem = filename.replace(/\.pdf$/i, "").replace(/_/g, " ");
        const section = stem.match(/^(FF\d+|\d+)/i);
        if (!section) return stem;
        return /^FF/i.test(section[0]) ? `Firewall Forward ${section[0].slice(2)}` : `Section ${section[0]}`;
      }

      function createPlan(filename) {
        const article = document.createElement("article");
        article.className = "plan";
        const name = document.createElement("div");
        name.className = "plan-name";
        const title = document.createElement("h3");
        title.textContent = planTitle(filename);
        name.append(title);
        const fileName = document.createElement("p");
        fileName.textContent = filename;
        name.append(fileName);
        article.append(name);

        const link = document.createElement("a");
        link.href = planUrl(filename);
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "Open PDF";
        link.setAttribute("aria-label", `Open ${filename} in a new tab`);
        article.append(link);
        return article;
      }

      async function loadPlans() {
        try {
          const response = await fetch("./logs/Documents/VansPlans/plans.json");
          if (!response.ok) throw new Error("The Van's plans list could not be loaded.");
          const filenames = await response.json();
          if (!Array.isArray(filenames)) throw new Error("The Van's plans list has an unexpected format.");

          const plans = filenames.filter((filename) => typeof filename === "string" && /\.pdf$/i.test(filename))
            .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
          plansContainer.replaceChildren(...plans.map(createPlan));
          planCount.textContent = `${plans.length} ${plans.length === 1 ? "plan" : "plans"}`;
          status.hidden = true;
          if (plans.length === 0) {
            status.hidden = false;
            status.textContent = "No Van's plans have been added yet.";
          }
        } catch (error) {
          status.classList.add("error");
          status.textContent = `${error.message} Open this page through a local web server rather than directly as a file.`;
        }
      }

      loadPlans();
    </script>
  </body>
</html>
