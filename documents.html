<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1555e7">
    <meta name="description" content="Reference documents for the N917AJ aircraft build.">
    <title>Build Documents | N917AJ</title>
    <style>
      :root {
        color-scheme: light;
        --blue: #155799;
        --ink: #263238;
        --muted: #64748b;
        --line: #e5eaf0;
        --paper: #fff;
        --canvas: #c9ccce;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      a { color: var(--blue); }

      .hero {
        padding: 38px 24px 40px;
        background:
          linear-gradient(90deg, rgb(8 20 34 / 78%), rgb(8 20 34 / 28%)),
          url("./img_0204-banner.jpg") center 54% / cover no-repeat;
        color: #fff;
      }

      .hero-inner, main, footer {
        width: min(100% - 40px, 900px);
        margin-inline: auto;
      }

      .back-link {
        display: inline-block;
        margin-bottom: 20px;
        color: #e7f2ff;
        font-size: .92rem;
        text-decoration: none;
      }

      .back-link:hover { text-decoration: underline; }
      .eyebrow { margin: 0 0 8px; color: #d7f3e5; font-size: .75rem; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2.4rem, 7vw, 4.5rem); letter-spacing: -.055em; line-height: 1.05; }
      .intro { max-width: 640px; margin: 17px 0 0; color: #eefaf4; font-size: clamp(1rem, 2.5vw, 1.2rem); }

      main { min-height: 55vh; padding-block: 36px 64px; }
      .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
      h2 { margin: 0; font-size: 1.35rem; letter-spacing: -.025em; }
      #document-count { color: var(--muted); font-size: .9rem; }
      .documents { display: grid; gap: 13px; }

      .collection-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
        padding: 18px 20px;
        border: 1px solid #c9d9eb;
        border-radius: 12px;
        background: #edf5ff;
        color: var(--ink);
        text-decoration: none;
      }

      .collection-link:hover { border-color: var(--blue); background: #e5f0ff; }
      .collection-link:focus-visible { outline: 3px solid #70cba1; outline-offset: 3px; }
      .collection-link h3 { margin: 0 0 3px; font-size: 1.02rem; }
      .collection-link p { margin: 0; color: var(--muted); font-size: .85rem; }
      .collection-link-count { flex: 0 0 auto; color: var(--blue); font-size: .9rem; font-weight: 700; }

      .document {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--paper);
        box-shadow: 0 3px 12px rgb(23 43 77 / 4%);
      }

      .document-info { display: flex; min-width: 0; align-items: flex-start; gap: 15px; }
      .pdf-icon { display: grid; width: 44px; height: 50px; flex: 0 0 auto; place-items: center; border-radius: 8px; background: #fff0ef; color: #b63832; font-size: .73rem; font-weight: 800; }
      .document h3 { margin: 0 0 4px; font-size: 1.02rem; line-height: 1.35; overflow-wrap: anywhere; }
      .document-meta { margin: 0; color: var(--muted); font-size: .82rem; }
      .document-actions { display: flex; flex: 0 0 auto; flex-wrap: wrap; gap: 9px; }
      .document-actions a { display: inline-block; padding: 7px 12px; border: 1px solid #d5dde6; border-radius: 8px; color: var(--blue); font-size: .85rem; font-weight: 650; text-decoration: none; }
      .document-actions a:first-child { border-color: var(--blue); background: var(--blue); color: #fff; }
      .document-actions a:hover { filter: brightness(.94); }
      .document-actions a:focus-visible, .back-link:focus-visible { outline: 3px solid #70cba1; outline-offset: 3px; }
      .status { padding: 30px 20px; border: 1px dashed #cbd5df; border-radius: 12px; background: var(--paper); color: var(--muted); text-align: center; }
      .status.error { color: #a33a32; }
      [hidden] { display: none !important; }
      footer { padding-block: 20px 34px; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }

      @media (max-width: 600px) {
        .document { align-items: stretch; flex-direction: column; gap: 14px; padding: 16px; }
        .document-actions { padding-left: 59px; }
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="hero-inner">
        <a class="back-link" href="./index.html">← Back to the build log</a>
        <p class="eyebrow">Experimental aircraft · N917AJ</p>
        <h1>Build documents</h1>
        <p class="intro">Reference manuals and plans used throughout the build.</p>
      </div>
    </header>

    <main>
      <section aria-labelledby="documents-heading">
        <div class="section-heading">
          <h2 id="documents-heading">Reference library</h2>
          <span id="document-count" aria-live="polite"></span>
        </div>
        <a class="collection-link" href="./vans-plans.html">
          <div>
            <h3>Van's Plans</h3>
            <p>Browse the aircraft plans by section.</p>
          </div>
          <span class="collection-link-count" id="plans-count">View plans →</span>
        </a>
        <div id="status" class="status" role="status">Loading documents…</div>
        <div id="documents" class="documents"></div>
      </section>
    </main>

    <footer>Reference documents for the N917AJ build log.</footer>

    <script>
      const documentsContainer = document.querySelector("#documents");
      const status = document.querySelector("#status");
      const documentCount = document.querySelector("#document-count");
      const plansCount = document.querySelector("#plans-count");

      function formatDate(value) {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? "" : new Intl.DateTimeFormat(undefined, {
          year: "numeric", month: "short", day: "numeric", timeZone: "UTC"
        }).format(date);
      }

      function formatSize(bytes) {
        const size = Number(bytes);
        if (!Number.isFinite(size) || size <= 0) return "";
        const units = ["B", "KB", "MB", "GB"];
        const unit = Math.min(Math.floor(Math.log(size) / Math.log(1024)), units.length - 1);
        return `${(size / (1024 ** unit)).toFixed(unit === 0 ? 0 : 1)} ${units[unit]}`;
      }

      function documentUrl(filename) {
        return "./logs/" + filename.split("/").map(encodeURIComponent).join("/");
      }

      function createDocument(item) {
        const article = document.createElement("article");
        article.className = "document";

        const info = document.createElement("div");
        info.className = "document-info";
        const icon = document.createElement("span");
        icon.className = "pdf-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = "PDF";
        info.append(icon);

        const copy = document.createElement("div");
        const title = document.createElement("h3");
        title.textContent = typeof item.title === "string" && item.title.trim()
          ? item.title.trim()
          : item.filename.split("/").pop();
        copy.append(title);
        const meta = [formatDate(item.dateAdded), formatSize(item.fileSize)].filter(Boolean);
        if (meta.length) {
          const description = document.createElement("p");
          description.className = "document-meta";
          description.textContent = meta.join(" · ");
          copy.append(description);
        }
        info.append(copy);
        article.append(info);

        const url = documentUrl(item.filename);
        const actions = document.createElement("div");
        actions.className = "document-actions";
        const open = document.createElement("a");
        open.href = url;
        open.target = "_blank";
        open.rel = "noopener";
        open.textContent = "Open PDF";
        open.setAttribute("aria-label", `Open ${title.textContent} in a new tab`);
        actions.append(open);

        const download = document.createElement("a");
        download.href = url;
        download.download = item.filename.split("/").pop();
        download.textContent = "Download";
        download.setAttribute("aria-label", `Download ${title.textContent}`);
        actions.append(download);
        article.append(actions);
        return article;
      }

      async function loadDocuments() {
        try {
          const [response, plansResponse] = await Promise.all([
            fetch("./logs/documents.json"),
            fetch("./logs/Documents/VansPlans/plans.json")
          ]);
          if (!response.ok || !plansResponse.ok) throw new Error("The document list could not be loaded.");
          const [items, plans] = await Promise.all([response.json(), plansResponse.json()]);
          if (!Array.isArray(items) || !Array.isArray(plans)) throw new Error("The document list has an unexpected format.");

          items.sort((a, b) => (a.sortOrder ?? 0) - (b.sortOrder ?? 0));
          documentsContainer.replaceChildren(...items.filter((item) =>
            item && typeof item.filename === "string" && item.filename.trim()
          ).map(createDocument));
          documentCount.textContent = `${items.length} ${items.length === 1 ? "document" : "documents"}`;
          plansCount.textContent = `${plans.length} plans →`;
          status.hidden = true;
          if (items.length === 0) {
            status.hidden = false;
            status.textContent = "No documents have been added yet.";
          }
        } catch (error) {
          status.classList.add("error");
          status.textContent = `${error.message} Open this page through a local web server rather than directly as a file.`;
        }
      }

      loadDocuments();
    </script>
  </body>
</html>
